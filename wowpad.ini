; wowpad settings. Put next to wow.exe. Every key is optional.
; Restart the game after editing.
; Pad button names: A B X Y LB RB Start Back LStick RStick DPadUp DPadDown DPadLeft DPadRight, or None
; Key names: single letter/digit, SPACE TAB ESCAPE ENTER UP DOWN LEFT RIGHT SHIFT CTRL ALT, F1-F24, NUMPAD0-9

[Input]
; Controller poll interval in milliseconds (1-100)
PollMs=10
; Radial stick deadzone, fraction of full deflection (0.0-0.9)
StickDeadzone=0.24
; Trigger threshold, fraction of full pull (0.0-0.9)
TriggerThreshold=0.12

[Inject]
; SendInput (verified working under Proton) or PostMessage
Mode=SendInput

[Mode]
; Real mouse movement (pixels) that switches to desktop mode while the pointer is visible
MouseTravel=40
; Back held this long (ms) = bags instead of map
BackHoldMs=400

[Move]
; Left stick -> keys. Q/E are WoW's default strafe keys (A/D turn instead).
Forward=W
Back=S
Left=Q
Right=E
; Per-axis press/release points, after the deadzone (0-1)
PressAt=0.40
ReleaseAt=0.30
; Walk/run option (Esc > Interface > AddOns > WowPad, experimental): stick tilt below
; WalkBelow walks, above RunAbove runs; WalkDelayMs avoids a walk blip when pushing to full.
WalkBelow=0.60
RunAbove=0.80
WalkDelayMs=150

[Cursor]
; Right stick while the pointer is visible, pixels per second at full deflection
Speed=1200
; 1.0 = linear, 2.0 = fine control near the centre, fast at the edge
Curve=2.0
; Hold this to slow the pointer down (or None)
PrecisionButton=None
PrecisionScale=0.35
; Keep the pointer inside the game window
ClampToWindow=1
; Experimental, leave 0: warp the real cursor in pointer mode instead of relative motion
PointerWarp=0

[Camera]
; Right stick while the camera is active, pixels per second at full deflection
Speed=1000
InvertY=0
; LB+RB held: right stick zooms. Mouse-wheel steps per second at full deflection
ZoomSpeed=8
; Crosshair: pointer is parked this many pixels above the window centre when you
; pick up the pad (the dot sits where WoW's hidden pointer is)
CrosshairY=95
; Right stick resting this long (ms) pauses camera look so the crosshair can
; show tooltips ("peek"). 0 = off (or /wp peek in game)
PeekDelayMs=250

[Click]
; Trigger press/release points (0-1): set switching, and clicks in pointer mode
PressAt=0.50
ReleaseAt=0.35

[Log]
; Log button presses and mode/context changes
Buttons=1
; Log stick/trigger movement (noisy; for debugging)
Sticks=0
StickStep=0.10
